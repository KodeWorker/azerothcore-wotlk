services:
  ac-tools:
    # Docker auto-creates missing bind-mount targets as root:root on the
    # host, but the image otherwise runs as the non-root DOCKER_USER
    # (UID 1000). Run as root here instead of chown-ing the host dirs --
    # this is a one-off extraction job, not a long-lived service.
    user: root
    working_dir: /azerothcore/env/dist/bin
    volumes:
      # Missing from the tools image: CMake installs this alongside the
      # extractor binaries, but the Dockerfile's `tools` stage only copies
      # the 4 binaries themselves. Bind-mount it in instead of patching the
      # image.
      - ./src/tools/mmaps_generator/mmaps-config.yaml:/azerothcore/env/dist/bin/mmaps-config.yaml:ro
      # Persist extractor output to the host -- the base compose file only
      # mounts the client Data folder, so anything written by the
      # extractors (which default to writing relative to the cwd) would
      # otherwise be lost when the container exits.
      - ./env/dist/data/dbc:/azerothcore/env/dist/bin/dbc
      - ./env/dist/data/maps:/azerothcore/env/dist/bin/maps
      - ./env/dist/data/vmaps:/azerothcore/env/dist/bin/vmaps
      - ./env/dist/data/mmaps:/azerothcore/env/dist/bin/mmaps
      - ./env/dist/data/Cameras:/azerothcore/env/dist/bin/Cameras
    # Run the full extraction pipeline automatically instead of attaching
    # a shell and invoking each binary by hand.
    command: >
      bash -c "
        ./map_extractor &&
        ./vmap4_extractor &&
        ./vmap4_assembler &&
        ./mmaps_generator
      "
    # NOTE: ac-worldserver intentionally no longer consumes this extracted
    # data (see git history). mod-playerbots resolves spells almost
    # entirely by matching hardcoded English name literals against the
    # server's own loaded DBC data. A genuine single-locale zhTW client
    # has no enUS strings anywhere in its DBC, so pointing ac-worldserver
    # at zhTW-only extracted data broke that matching everywhere (bots
    # stopped casting spells) for no display benefit: item/spell/NPC names
    # are rendered client-side from each player's own local DBC/MPQ files
    # looked up by ID, never sent by the server. ac-worldserver now uses
    # the default enUS wowgaming/client-data image again. This ac-tools
    # extraction pipeline is left here in case zhTW-locale data is needed
    # for something else in the future, but nothing currently consumes it.
